plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.4.0"
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'com.csl'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    // PacketEvents releases
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://jitpack.io") }
}

dependencies {
    // Compile against the oldest Paper API we support; the plugin then runs on
    // 1.21.x servers as well as the latest 26.x releases.
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")

    // Protocol library - encodes our packets correctly for every client version
    // from 1.21.5 up to 26.3 (PacketEvents 2.14.0).
    implementation("com.github.retrooper:packetevents-spigot:2.14.0")

    implementation("org.incendo:cloud-paper:2.0.1")
    implementation("org.incendo:cloud-annotations:2.1.0")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks {
    runServer {
        // Target the latest Minecraft release (2026 year-based versioning).
        // The plugin itself still supports every version from 1.21.5 upwards.
        minecraftVersion("26.3")
    }
    jar {
        manifest {
            attributes["paperweight-mappings-namespace"] = "mojang"
            attributes["Main-Class"] = "com.csl.moparticles.MoParticlesPlugin"
        }
    }
    shadowJar {
        archiveClassifier = 'all'
        mergeServiceFiles()
        // Relocate PacketEvents so our shaded copy never collides with a
        // standalone packetevents plugin that may already be on the server.
        relocate('com.github.retrooper', 'com.csl.moparticles.libs.packetevents.com.github.retrooper')
        relocate('io.github.retrooper', 'com.csl.moparticles.libs.packetevents.io.github.retrooper')
        manifest {
            attributes["paperweight-mappings-namespace"] = "mojang"
        }
    }
}

// Rewrites the shaded jar manifest so Paper does not complain about
// multi-release class files pulled in by bundled dependencies.
def postProcessManifest = tasks.register('postProcessManifest') {
    dependsOn 'shadowJar'
    doLast {
        def jarFile = tasks.getByName('shadowJar').archiveFile.get().asFile
        if (!jarFile.exists()) return

        def tmp = new File(jarFile.parent, jarFile.name + ".tmp")
        def src = new java.util.jar.JarFile(jarFile)
        try {
            def out = new java.util.jar.JarOutputStream(new java.io.FileOutputStream(tmp))
            try {
                def entry = src.entries()
                while (entry.hasMoreElements()) {
                    def e = entry.nextElement()
                    if (e.getName() == 'META-INF/MANIFEST.MF') {
                        def m = new java.util.jar.Manifest(src.getInputStream(e))
                        m.mainAttributes.putValue("Multi-Release", "false")
                        m.mainAttributes.putValue("paperweight-mappings-namespace", "mojang")
                        out.putNextEntry(new java.util.jar.JarEntry(e.getName()))
                        m.write(out)
                    } else {
                        out.putNextEntry(new java.util.jar.JarEntry(e.getName()))
                        def is = src.getInputStream(e)
                        try { is.transferTo(out) } finally { is.close() }
                    }
                    out.closeEntry()
                }
            } finally { out.close() }
        } finally { src.close() }
        jarFile.delete()
        tmp.renameTo(jarFile)
        logger.lifecycle("[MoParticles] patched manifest of " + jarFile.name)
    }
}
tasks.named('shadowJar').configure { finalizedBy postProcessManifest }
