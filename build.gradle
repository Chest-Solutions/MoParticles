plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.4.0"
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'com.csl'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://jitpack.io") }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")

    implementation("org.incendo:cloud-paper:2.0.0")
    implementation("org.incendo:cloud-annotations:2.0.0")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.11")
    }
    jar {
        manifest {
            attributes["paperweight-mappings-namespace"] = "mojang"
            attributes["Main-Class"] = "com.csl.moparticles.MoParticlesPlugin"
        }
    }
    shadowJar {
        manifest {
            attributes["paperweight-mappings-namespace"] = "mojang"
        }
    }
}

def postProcessManifest = tasks.register('postProcessManifest') {
    dependsOn 'shadowJar'
    doLast {
        def jarFile = file("build/libs/MoParticles-1.0-all.jar")
        if (!jarFile.exists()) return

        def tmp = new File(jarFile.parent, jarFile.name + ".tmp")
        def src = new java.util.jar.JarFile(jarFile)
        try {
            def out = new java.util.jar.JarOutputStream(new java.io.FileOutputStream(tmp))
            try {
                def entry = src.entries()
                while (entry.hasMoreElements()) {
                    def e = entry.nextElement()
                    if (e.getName() == 'META-INF/MANIFEST.MF') {
                        def m = new java.util.jar.Manifest(src.getInputStream(e))
                        m.mainAttributes.putValue("Multi-Release", "false")
                        m.mainAttributes.putValue("paperweight-mappings-namespace", "mojang")
                        out.putNextEntry(new java.util.jar.JarEntry(e.getName()))
                        m.write(out)
                    } else {
                        out.putNextEntry(new java.util.jar.JarEntry(e.getName()))
                        def is = src.getInputStream(e)
                        try { is.transferTo(out) } finally { is.close() }
                    }
                    out.closeEntry()
                }
            } finally { out.close() }
        } finally { src.close() }
        jarFile.delete()
        tmp.renameTo(jarFile)
        logger.lifecycle("[MoParticles] patched manifest of " + jarFile.name)
    }
}
tasks.named('shadowJar').configure { finalizedBy postProcessManifest }
